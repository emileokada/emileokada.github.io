<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>Graded Kazhdan–Lusztig Atlas</title></head><body><p id="loading">Loading atlas…</p><script>
(async()=>{try{const response=await fetch('page.html.gz');if(!response.ok)throw new Error('Download failed');const stream=response.body.pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close();}catch(error){document.getElementById('loading').textContent='Unable to load the atlas. Please use a current browser and reload. '+error.message;}})();
</script></body></html>
